<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 222" role="img"><title>소음기는 솔레노이드밸브 배기구에 끼운다</title><rect width="460" height="222" fill="#fff"/><defs><pattern id="dot" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#c9a46a"/><circle cx="2" cy="2" r="0.9" fill="#8a6a22"/></pattern></defs><rect x="120" y="40" width="220" height="70" rx="6" fill="#e9eef7" stroke="#5b6b85" stroke-width="1.4"/><text x="230" y="72" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="12" fill="#333b48">솔레노이드밸브(전자밸브)</text><text x="230" y="90" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="12" fill="#333b48">공기 방향을 바꾸는 밸브</text><rect x="70" y="58" width="50" height="34" fill="#cfd6e2" stroke="#5b6b85"/><text x="95" y="50" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="12" fill="#333b48">코일</text><rect x="180" y="30" width="16" height="10" fill="#9fb0cc"/><rect x="230" y="30" width="16" height="10" fill="#9fb0cc"/><rect x="280" y="30" width="16" height="10" fill="#9fb0cc"/><text x="230" y="22" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="12" fill="#333b48">위쪽 구멍 = 실린더 쪽 · 공급 쪽</text><rect x="181" y="110" width="18" height="10" fill="#2b2f36" stroke="#111" stroke-width="1.2"/><line x1="181" y1="112.8" x2="199" y2="112.8" stroke="#555"/><line x1="181" y1="117.2" x2="199" y2="117.2" stroke="#555"/><rect x="178" y="120" width="24" height="44" rx="4" fill="#2b2f36" stroke="#111" stroke-width="1.2"/><rect x="182" y="126" width="16" height="4" rx="1" fill="#f4f4f4"/><rect x="182" y="135" width="16" height="4" rx="1" fill="#f4f4f4"/><rect x="182" y="144" width="16" height="4" rx="1" fill="#f4f4f4"/><rect x="182" y="153" width="16" height="4" rx="1" fill="#f4f4f4"/><rect x="261" y="110" width="18" height="10" fill="#2b2f36" stroke="#111" stroke-width="1.2"/><line x1="261" y1="112.8" x2="279" y2="112.8" stroke="#555"/><line x1="261" y1="117.2" x2="279" y2="117.2" stroke="#555"/><rect x="258" y="120" width="24" height="44" rx="4" fill="#2b2f36" stroke="#111" stroke-width="1.2"/><rect x="262" y="126" width="16" height="4" rx="1" fill="#f4f4f4"/><rect x="262" y="135" width="16" height="4" rx="1" fill="#f4f4f4"/><rect x="262" y="144" width="16" height="4" rx="1" fill="#f4f4f4"/><rect x="262" y="153" width="16" height="4" rx="1" fill="#f4f4f4"/><path d="M176 172 q-6 8 0 16 M190 172 v16 M204 172 q6 8 0 16" fill="none" stroke="#7a8aa6" stroke-width="1.4"/><path d="M256 172 q-6 8 0 16 M270 172 v16 M284 172 q6 8 0 16" fill="none" stroke="#7a8aa6" stroke-width="1.4"/><text x="230" y="210" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="12" fill="#333b48">아래 배기구에 소음기를 끼운다 — 빠져나가는 공기가 흡음재를 지나며 소리가 작아진다</text></svg>