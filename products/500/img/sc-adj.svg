<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 212" role="img"><title>스피드컨트롤러 조절 — 조절 나사를 오른쪽으로 조이면 느려지고 왼쪽으로 풀면 빨라진다</title><rect width="600" height="212" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#16a34a"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#e8742c"/></marker></defs><rect x="110.2" y="70" width="39.6" height="30.800000000000004" rx="4.4" fill="#e4e7ec" stroke="#6b7280" stroke-width="1.1"/><line x1="114.6" y1="74.4" x2="114.6" y2="96.4" stroke="#9aa1ad" stroke-width="0.8"/><line x1="122.3" y1="74.4" x2="122.3" y2="96.4" stroke="#9aa1ad" stroke-width="0.8"/><line x1="130.0" y1="74.4" x2="130.0" y2="96.4" stroke="#9aa1ad" stroke-width="0.8"/><line x1="137.7" y1="74.4" x2="137.7" y2="96.4" stroke="#9aa1ad" stroke-width="0.8"/><line x1="145.4" y1="74.4" x2="145.4" y2="96.4" stroke="#9aa1ad" stroke-width="0.8"/><rect x="123.4" y="100.80000000000001" width="13.200000000000001" height="13.200000000000001" fill="#d7dbe2" stroke="#7a828f" stroke-width="1"/><rect x="103.6" y="114.0" width="52.800000000000004" height="15.400000000000002" rx="2.2" fill="#e4e7ec" stroke="#6b7280" stroke-width="1.1"/><path d="M104 60 A28 12 0 0 1 156 60" fill="none" stroke="#e8742c" stroke-width="3" marker-end="url(#ao)"/><text x="130" y="30" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="12" fill="#c2410c" font-weight="700">오른쪽(시계 방향)으로 조인다</text><text x="130" y="160" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="12" fill="#333b48">틈이 좁아진다 → 실린더가 느려진다</text><rect x="410.2" y="70" width="39.6" height="30.800000000000004" rx="4.4" fill="#e4e7ec" stroke="#6b7280" stroke-width="1.1"/><line x1="414.6" y1="74.4" x2="414.6" y2="96.4" stroke="#9aa1ad" stroke-width="0.8"/><line x1="422.3" y1="74.4" x2="422.3" y2="96.4" stroke="#9aa1ad" stroke-width="0.8"/><line x1="430.0" y1="74.4" x2="430.0" y2="96.4" stroke="#9aa1ad" stroke-width="0.8"/><line x1="437.70000000000005" y1="74.4" x2="437.70000000000005" y2="96.4" stroke="#9aa1ad" stroke-width="0.8"/><line x1="445.40000000000003" y1="74.4" x2="445.40000000000003" y2="96.4" stroke="#9aa1ad" stroke-width="0.8"/><rect x="423.4" y="100.80000000000001" width="13.200000000000001" height="13.200000000000001" fill="#d7dbe2" stroke="#7a828f" stroke-width="1"/><rect x="403.6" y="114.0" width="52.800000000000004" height="15.400000000000002" rx="2.2" fill="#e4e7ec" stroke="#6b7280" stroke-width="1.1"/><path d="M456 60 A28 12 0 0 0 404 60" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#ag)"/><text x="430" y="30" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="12" fill="#15803d" font-weight="700">왼쪽(시계 반대 방향)으로 푼다</text><text x="430" y="160" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="12" fill="#333b48">틈이 넓어진다 → 실린더가 빨라진다</text><line x1="168" y1="124" x2="214" y2="124" stroke="#1e3a8a"/><text x="218" y="128" text-anchor="start" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="11.5" fill="#1e3a8a" font-weight="700">잠금 너트</text><text x="300" y="196" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="12" fill="#333b48" font-weight="700">잠금 너트를 풀고 맞춘 뒤, 그 자리에서 잠금 너트를 다시 조인다</text></svg>