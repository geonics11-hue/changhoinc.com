<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 210" role="img"><title>스피드컨트롤러 공기 흐름 — 들어가는 공기는 그대로, 나오는 공기는 좁은 틈으로 줄인다</title><rect width="600" height="210" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#16a34a"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#e8742c"/></marker></defs><text x="140" y="26" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="12.5" fill="#16a34a" font-weight="700">실린더로 들어가는 공기</text><rect x="20" y="60" width="240" height="70" rx="8" fill="#f3f6fa" stroke="#5b6b85" stroke-width="1.2"/><rect x="110" y="40" width="20" height="44" fill="#d7dbe2" stroke="#6b7280"/><path d="M112 84 L120 98 L128 84Z" fill="#9aa1ad" stroke="#6b7280"/><path d="M30 110 H250" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#ag)"/><text x="140" y="160" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="11.5" fill="#333b48">넓은 길로 그대로 통과한다</text><text x="440" y="26" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="12.5" fill="#c2410c" font-weight="700">실린더에서 나오는 공기</text><rect x="320" y="60" width="240" height="70" rx="8" fill="#f3f6fa" stroke="#5b6b85" stroke-width="1.2"/><rect x="410" y="40" width="20" height="44" fill="#d7dbe2" stroke="#6b7280"/><path d="M412 84 L420 98 L428 84Z" fill="#9aa1ad" stroke="#6b7280"/><path d="M550 105 H330" fill="none" stroke="#e8742c" stroke-width="3" marker-end="url(#ao)"/><text x="440" y="160" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="11.5" fill="#333b48">조절 나사 끝의 좁은 틈으로만 통과한다</text><text x="300" y="196" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="12.5" fill="#333b48" font-weight="700">나오는 공기가 천천히 배출되는 만큼 실린더도 천천히 움직인다</text></svg>