<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img"><title>코일 1개 단동형, 코일 2개 복동형, 3위치 클로즈센터형의 움직임</title><rect width="760" height="400" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#9aa3b0"/></marker></defs><rect x="60" y="48" width="170" height="52" rx="5" fill="#dfe3e9" stroke="#6b7280" stroke-width="1.3"/><rect x="230" y="51" width="34" height="46" rx="4" fill="#2f3542" stroke="#1f2430"/><rect x="242.0" y="37" width="10" height="14" fill="#3b4252"/><rect x="20" y="64" width="40" height="20" fill="#f3f6fa" stroke="#9aa3b0"/><polyline points="22.0,83 26.25,65 30.5,83 34.75,65 39.0,83 43.25,65 47.5,83 51.75,65 56.0,83" fill="none" stroke="#6b7280" stroke-width="2"/><rect x="82" y="60" width="60" height="28" fill="#fff" stroke="#6b7280"/><rect x="148" y="60" width="60" height="28" fill="#fff" stroke="#6b7280"/><text x="320" y="60" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="15" font-weight="700" fill="#161a22">단동형 (S · 싱글)</text><text x="320" y="80" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">코일 1개 + 반대쪽 스프링</text><text x="320" y="100" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="11.5" fill="#4b5563">전기가 들어오면 공기 방향이 바뀌고, 끊기면 스프링이 원래 방향으로 바꿉니다</text><line x1="20" y1="136" x2="740" y2="136" stroke="#eef1f6"/><rect x="60" y="168" width="170" height="52" rx="5" fill="#dfe3e9" stroke="#6b7280" stroke-width="1.3"/><rect x="230" y="171" width="34" height="46" rx="4" fill="#2f3542" stroke="#1f2430"/><rect x="242.0" y="157" width="10" height="14" fill="#3b4252"/><rect x="26" y="171" width="34" height="46" rx="4" fill="#2f3542" stroke="#1f2430"/><rect x="38.0" y="157" width="10" height="14" fill="#3b4252"/><rect x="82" y="180" width="60" height="28" fill="#fff" stroke="#6b7280"/><rect x="148" y="180" width="60" height="28" fill="#fff" stroke="#6b7280"/><text x="320" y="180" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="15" font-weight="700" fill="#161a22">복동형 (D · 더블)</text><text x="320" y="200" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">양쪽에 코일 2개</text><text x="320" y="220" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="11.5" fill="#4b5563">한쪽 코일에 신호를 주면 바뀐 채 유지되고, 반대쪽 코일에 신호를 줘야 다시 바뀝니다</text><line x1="20" y1="256" x2="740" y2="256" stroke="#eef1f6"/><rect x="60" y="288" width="170" height="52" rx="5" fill="#dfe3e9" stroke="#6b7280" stroke-width="1.3"/><rect x="230" y="291" width="34" height="46" rx="4" fill="#2f3542" stroke="#1f2430"/><rect x="242.0" y="277" width="10" height="14" fill="#3b4252"/><rect x="26" y="291" width="34" height="46" rx="4" fill="#2f3542" stroke="#1f2430"/><rect x="38.0" y="277" width="10" height="14" fill="#3b4252"/><rect x="72" y="300" width="46" height="28" fill="#fff" stroke="#6b7280"/><rect x="122" y="300" width="46" height="28" fill="#fff" stroke="#6b7280"/><rect x="172" y="300" width="46" height="28" fill="#fff" stroke="#6b7280"/><text x="145" y="319" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="11" fill="#1e3a8a" font-weight="700">가운데</text><text x="320" y="300" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="15" font-weight="700" fill="#161a22">3위치 클로즈센터 (H)</text><text x="320" y="320" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">코일 2개 + 가운데 자리</text><text x="320" y="340" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="11.5" fill="#4b5563">두 코일이 모두 꺼지면 가운데 자리에 서고 구멍이 모두 막힙니다</text></svg>