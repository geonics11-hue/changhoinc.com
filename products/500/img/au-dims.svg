ly="Noto Sans KR,Malgun Gothic,sans-serif" font-size="12" fill="#6b7280" font-weight="400">OUT</text><path d="M221 152 V196" stroke="#94a3b8" stroke-dasharray="3 3"/><path d="M379 152 V196" stroke="#94a3b8" stroke-dasharray="3 3"/><text x="150" y="192" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="12" fill="#333b48" font-weight="400">양쪽 나사 구멍 크기가</text><text x="150" y="210" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="12" fill="#333b48" font-weight="400">모델명 끝 숫자입니다</text><text x="150" y="228" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="12" fill="#1e3a8a" font-weight="700">(02 = 1/4)</text><rect x="296" y="238" width="8" height="12" fill="#c9a24a" stroke="#8a6d22"/><text x="410" y="228" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="12" fill="#333b48" font-weight="700">컵은 아래로 — 세워서 답니다</text><text x="410" y="246" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="12" fill="#333b48" font-weight="400">아래 나사로 물을 뺍니다</text></svg>