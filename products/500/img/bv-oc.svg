<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 290" role="img"><title>볼밸브 열림과 닫힘 — 레버가 배관과 나란하면 열림, 직각이면 닫힘</title><rect width="620" height="290" fill="#fff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#2563eb"/></marker></defs><text x="150" y="24" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="12" fill="#16a34a" font-weight="700">열림 — 레버가 배관과 나란하다</text><rect x="40" y="92" width="220" height="24" fill="#e9eef7" stroke="#5b6b85"/><rect x="110" y="80" width="80" height="48" rx="14" fill="#dcb85e" stroke="#8a6d22" stroke-width="1.2"/><circle cx="150" cy="104" r="9" fill="#d7dbe2" stroke="#7a828f" stroke-width="1"/><rect x="144" y="94" width="96" height="12" rx="3" fill="#e8742c" stroke="#9a4512" stroke-width="1.2"/><path d="M20 104 H70" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#ar)"/><path d="M230 104 H280" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#ar)"/><circle cx="150" cy="196" r="30" fill="#e7ebf1" stroke="#7a828f" stroke-width="1.4"/><rect x="120" y="186" width="60" height="20" fill="#fff" stroke="#7a828f"/><text x="150" y="246" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="11" fill="#333b48">안쪽 공의 구멍이 배관 방향 → 공기가 흐른다</text><text x="470" y="24" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="12" fill="#b91c1c" font-weight="700">닫힘 — 레버가 배관과 직각이다</text><rect x="360" y="92" width="220" height="24" fill="#e9eef7" stroke="#5b6b85"/><rect x="430" y="80" width="80" height="48" rx="14" fill="#dcb85e" stroke="#8a6d22" stroke-width="1.2"/><circle cx="470" cy="104" r="9" fill="#d7dbe2" stroke="#7a828f" stroke-width="1"/><rect x="464" y="60" width="12" height="50" rx="3" fill="#e8742c" stroke="#9a4512" stroke-width="1.2"/><path d="M340 104 H390" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#ar)"/><path d="M430 92 l16 24 M446 92 l-16 24" stroke="#b91c1c" stroke-width="3"/><circle cx="470" cy="196" r="30" fill="#e7ebf1" stroke="#7a828f" stroke-width="1.4"/><rect x="460" y="166" width="20" height="60" fill="#fff" stroke="#7a828f"/><text x="470" y="246" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="11" fill="#333b48">구멍이 옆으로 향해 → 공기가 막힌다</text><text x="310" y="274" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="12" fill="#333b48" font-weight="700">레버는 90도(4분의 1바퀴)만 움직인다</text></svg>