</head><body>
<p>이 기종의 모델명이 <b>WTM-M3-M16-MO-1100K</b>(한국어 화면)로 바뀌어 주소를 옮겼습니다.</p>

<!-- ===== 사진 크게 보기 (zoom) ===== -->
<style id="zoom-css">
.hcard img.zm-on,.gallery img.zm-on{cursor:zoom-in}
.lb-strip a.lb-go{display:block;line-height:0;border-radius:4px}
.lb-strip a.lb-go:hover img{opacity:.75}
.zm{position:fixed;inset:0;z-index:10000;background:rgba(10,12,16,.92);display:flex;align-items:center;justify-content:center;flex-direction:column;padding:56px 64px 20px}
.zm[hidden]{display:none}
.zm img{max-width:100%;max-height:calc(100vh - 130px);object-fit:contain;background:#fff;border-radius:4px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.zm .zm-cap{color:#e8eaee;font-size:15px;line-height:1.5;margin-top:12px;text-align:center;max-width:900px}
.zm .zm-n{color:#9aa3ad;font-size:13px;margin-top:4px}
.zm button{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:26px;line-height:48px;cursor:pointer;padding:0}
.zm button:hover{background:rgba(255,255,255,.25)}
.zm .zm-x{top:12px;right:14px}
.zm .zm-p{left:10px;top:50%;margin-top:-24px}
.zm .zm-q{right:10px;top:50%;margin-top:-24px}
@media (max-width:640px){.zm{padding:56px 8px 16px}.zm .zm-p,.zm .zm-q{top:auto;bottom:14px;margin:0}.zm img{max-height:calc(100vh - 170px)}}
@media print{.zm{display:none!important}}
</style>
<div class="zm" id="zm" hidden role="dialog" aria-modal="true" aria-label="사진 크게 보기">
<button type="button" class="zm-x" aria-label="닫기">&times;</button>
<button type="button" class="zm-p" aria-label="이전 사진">&#8249;</button>
<img alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
<div class="zm-cap"></div><div class="zm-n"></div>
<button type="button" class="zm-q" aria-label="다음 사진">&#8250;</button>
</div>
<script id="zoom-js">
(function(){var z=document.getElementById('zm');if(!z)return;
var L=[].slice.call(document.querySelectorAll('.hcard img,.gallery img')).filter(function(i){return !i.closest('a')&&!i.closest('.vfacade')&&!i.closest('.zm');});
if(!L.length)return;var im=z.querySelector('img'),cp=z.querySelector('.zm-cap'),nn=z.querySelector('.zm-n'),k=0,ov='';
function cap(i){var c=i.closest('.gcell');var g=c&&c.querySelector('.gc');return (g&&g.textContent.trim())||i.alt||'';}
function show(n){k=(n+L.length)%L.length;var i=L[k];im.src=i.currentSrc||i.src;im.alt=i.alt;cp.textContent=cap(i);nn.textContent=L.length>1?(k+1)+' / '+L.length:'';z.querySelector('.zm-p').style.display=z.querySelector('.zm-q').style.display=L.length>1?'':'none';}
function open(n){show(n);z.hidden=false;ov=document.body.style.overflow;document.body.style.overflow='hidden';}
function shut(){z.hidden=true;document.body.style.overflow=ov;}
L.forEach(function(i,n){i.classList.add('zm-on');i.addEventListener('click',function(){open(n);});});
z.querySelector('.zm-x').onclick=shut;z.querySelector('.zm-p').onclick=function(e){e.stopPropagation();show(k-1);};z.querySelector('.zm-q').onclick=function(e){e.stopPropagation();show(k+1);};
z.addEventListener('click',function(e){if(e.target===z)shut();});
document.addEventListener('keydown',function(e){if(z.hidden)return;if(e.key==='Escape')shut();else if(e.key==='ArrowLeft')show(k-1);else if(e.key==='ArrowRight')show(k+1);});
var sx=null;z.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;},{passive:true});
z.addEventListener('touchend',function(e){if(sx===null)return;var d=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(d)>50)show(d<0?k+1:k-1);});
})();
</script>
<!-- ===== /사진 크게 보기 ===== -->
</body></html>
