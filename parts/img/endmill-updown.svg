<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" font-family="'Noto Sans KR','Malgun Gothic',sans-serif"><rect width="900" height="410" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EF8943"/></marker></defs><rect x="30" y="190" width="340" height="80" fill="#f6efe2" stroke="#b9a37a"/><rect x="160" y="190" width="80" height="48" fill="#fff" stroke="#b9a37a"/><rect x="178" y="40" width="44" height="80" fill="#e9edf3" stroke="#161a22" stroke-width="1.6"/><rect x="170" y="120" width="60" height="116" fill="#e9edf3" stroke="#161a22" stroke-width="1.6"/><path d="M170,154 Q200,143 230,132" fill="none" stroke="#8a94a6" stroke-width="2.2"/><path d="M170,180 Q200,169 230,158" fill="none" stroke="#8a94a6" stroke-width="2.2"/><path d="M170,206 Q200,195 230,184" fill="none" stroke="#8a94a6" stroke-width="2.2"/><path d="M170,232 Q200,221 230,210" fill="none" stroke="#8a94a6" stroke-width="2.2"/><path d="M160,60 A44,12 0 0 0 240,60" fill="none" stroke="#1e3a8a" stroke-width="1.6" marker-end="url(#a)"/><line x1="145" y1="220" x2="125.75" y2="135" stroke="#EF8943" stroke-width="3" marker-end="url(#o)"/><line x1="255" y1="220" x2="274.25" y2="135" stroke="#EF8943" stroke-width="3" marker-end="url(#o)"/><text x="292" y="128" font-size="14" fill="#EF8943" text-anchor="start" font-weight="800">칩이 위로</text><path d="M160,190 l-10,-7 l6,-4 l-8,-6" stroke="#b9a37a" stroke-width="2" fill="none"/><path d="M240,190 l10,-7 l-6,-4 l8,-6" stroke="#b9a37a" stroke-width="2" fill="none"/><text x="200" y="300" font-size="20" fill="#1e3a8a" text-anchor="middle" font-weight="900">정날 (칩이 위로)</text><text x="40" y="330" font-size="14.5" fill="#161a22" text-anchor="start" font-weight="400">· 칩이 홈 밖으로 잘 빠져 깊은 홈에 유리</text><text x="40" y="354" font-size="14.5" fill="#161a22" text-anchor="start" font-weight="400">· 윗면 가장자리에 거스러미가 생길 수 있음</text><text x="40" y="378" font-size="14.5" fill="#161a22" text-anchor="start" font-weight="400">· 얇은 자재는 위로 들릴 수 있음</text><rect x="480" y="190" width="340" height="80" fill="#f6efe2" stroke="#b9a37a"/><rect x="610" y="190" width="80" height="48" fill="#fff" stroke="#b9a37a"/><rect x="628" y="40" width="44" height="80" fill="#e9edf3" stroke="#161a22" stroke-width="1.6"/><rect x="620" y="120" width="60" height="116" fill="#e9edf3" stroke="#161a22" stroke-width="1.6"/><path d="M620,132 Q650,143 680,154" fill="none" stroke="#8a94a6" stroke-width="2.2"/><path d="M620,158 Q650,169 680,180" fill="none" stroke="#8a94a6" stroke-width="2.2"/><path d="M620,184 Q650,195 680,206" fill="none" stroke="#8a94a6" stroke-width="2.2"/><path d="M620,210 Q650,221 680,232" fill="none" stroke="#8a94a6" stroke-width="2.2"/><path d="M610,60 A44,12 0 0 0 690,60" fill="none" stroke="#1e3a8a" stroke-width="1.6" marker-end="url(#a)"/><line x1="575.75" y1="150" x2="595" y2="226" stroke="#EF8943" stroke-width="3" marker-end="url(#o)"/><line x1="724.25" y1="150" x2="705" y2="226" stroke="#EF8943" stroke-width="3" marker-end="url(#o)"/><text x="742" y="128" font-size="14" fill="#EF8943" text-anchor="start" font-weight="800">칩이 아래로</text><line x1="540" y1="180" x2="540" y2="196" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#a)"/><line x1="760" y1="180" x2="760" y2="196" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#a)"/><text x="780" y="186" font-size="13" fill="#1e3a8a" text-anchor="start" font-weight="400">자재를 눌러 줌</text><text x="650" y="300" font-size="20" fill="#1e3a8a" text-anchor="middle" font-weight="900">역날 (칩이 아래로)</text><text x="490" y="330" font-size="14.5" fill="#161a22" text-anchor="start" font-weight="400">· 윗면에 거스러미가 생기기 어려움</text><text x="490" y="354" font-size="14.5" fill="#161a22" text-anchor="start" font-weight="400">· 고정이 불안한 자재를 눌러 줌</text><text x="490" y="378" font-size="14.5" fill="#161a22" text-anchor="start" font-weight="400">· 칩이 홈 안에 남아 깊은 홈은 나눠서 가공</text></svg>