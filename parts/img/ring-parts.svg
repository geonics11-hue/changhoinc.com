<line x1="709.85" y1="230" x2="709.85" y2="332.5" stroke="#596fa1" stroke-width="1"/>
<line x1="573.15" y1="328.5" x2="706.85" y2="328.5" stroke="#596fa1" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="640.0" y="320.5" font-size="14" font-weight="700" fill="#596fa1" text-anchor="middle">B</text>
<line x1="560.5" y1="356.5" x2="719.5" y2="356.5" stroke="#596fa1" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="640.0" y="348.5" font-size="14" font-weight="700" fill="#596fa1" text-anchor="middle">A</text>
<rect x="800" y="147.5" width="9" height="165.0" fill="#f3d9b8" stroke="#b7793b" stroke-width="2"/>
<line x1="800" y1="312.5" x2="800" y2="360.5" stroke="#596fa1" stroke-width="1"/>
<line x1="809" y1="312.5" x2="809" y2="360.5" stroke="#596fa1" stroke-width="1"/>
<text x="804.5" y="376.5" font-size="14" font-weight="700" fill="#596fa1" text-anchor="middle">C</text>
<text x="804.5" y="135.5" font-size="13" font-weight="600" fill="#4b5563" text-anchor="middle">옆에서 본 모양</text>
<text x="560" y="402" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">A 외경 = 톱날 구멍(내경)에 맞춥니다</text>
<text x="560" y="424" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">B 내경 = 기계 축 지름에 맞춥니다</text>
<text x="560" y="446" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">C 두께 = 톱날 몸통 두께와 같거나 조금 얇게</text>
</svg>
