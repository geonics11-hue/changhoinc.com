<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#596fa1"/></marker><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#cfd6e0"/><line x1="0" y1="0" x2="0" y2="8" stroke="#8a96a8" stroke-width="2"/></pattern></defs>
<rect width="960" height="470" fill="#fff"/>
<text x="24" y="34" font-size="19" font-weight="800" fill="#1f2937">톱날 가락지 — 톱날 구멍과 기계 축 사이를 메웁니다</text>
<circle cx="230" cy="250" r="170" fill="#e9edf3" stroke="#1f2937" stroke-width="2"/>
<circle cx="230" cy="250" r="66.0" fill="#f3d9b8" stroke="#b7793b" stroke-width="2"/>
<circle cx="230" cy="250" r="55.88" fill="url(#h)" stroke="#1f2937" stroke-width="2"/>
<text x="230" y="255" font-size="15" font-weight="800" fill="#1f2937" text-anchor="middle">축</text>
<text x="230" y="112" font-size="15" font-weight="700" fill="#4b5563" text-anchor="middle">톱날 몸통</text>
<line x1="290.0" y1="220" x2="445" y2="155" stroke="#b7793b" stroke-width="1.3"/>
<text x="450" y="151" font-size="16" font-weight="800" fill="#b7793b" text-anchor="start">가락지</text>
<line x1="270" y1="290" x2="445" y2="360" stroke="#1f2937" stroke-width="1.3"/>
<text x="450" y="356" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">기계 축 Φ25.4</text>
<text x="450" y="378" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">톱날 구멍(내경) Φ30</text>
<text x="230" y="448" font-size="14" font-weight="600" fill="#4b5563" text-anchor="middle">예) 내경 30mm 톱날을 축 25.4mm 기계에 끼울 때</text>
<circle cx="640" cy="230" r="82.5" fill="#f3d9b8" stroke="#b7793b" stroke-width="2.2"/>
<circle cx="640" cy="230" r="69.85000000000001" fill="#fff" stroke="#b7793b" stroke-width="2"/>
<line x1="557.5" y1="230" x2="557.5" y2="360.5" stroke="#596fa1" stroke-width="1"/>
<line x1="722.5" y1="230" x2="722.5" y2="360.5" stroke="#596fa1" stroke-width="1"/>
