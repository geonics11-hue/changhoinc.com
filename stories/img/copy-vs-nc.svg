<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
<rect width="900" height="430" fill="#fff"/>
<defs><marker id="c" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker></defs>
<text x="225" y="40" font-size="24" font-weight="900" fill="#1e3a8a" text-anchor="middle">본 따라 깎기 (카피)</text>
<text x="675" y="40" font-size="24" font-weight="900" fill="#1e3a8a" text-anchor="middle">숫자 제어 (CNC)</text>
<line x1="450" y1="60" x2="450" y2="385" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="60" y="250" width="160" height="40" fill="#e9edf3" stroke="#334155" stroke-width="2.5"/>
<path d="M75 250 v-25 h35 v-18 h40 v18 h55 v25" fill="#e9edf3" stroke="#334155" stroke-width="2.5"/>
<text x="140" y="310" font-size="15" fill="#334155" text-anchor="middle" font-weight="700">본(쇠 틀)</text>
<rect x="240" y="250" width="160" height="40" fill="#cfd8e6" stroke="#334155" stroke-width="2.5"/>
<path d="M255 250 v-25 h35 v-18 h40 v18 h55 v25" fill="#cfd8e6" stroke="#334155" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="320" y="310" font-size="15" fill="#334155" text-anchor="middle" font-weight="700">깎는 재료</text>
<polygon points="145,140 160,175 130,175" fill="#7a5c1e" stroke="#334155" stroke-width="2"/>
<polygon points="325,140 340,175 310,175" fill="#9fb0c8" stroke="#334155" stroke-width="2"/>
<line x1="145" y1="105" x2="325" y2="105" stroke="#334155" stroke-width="6"/>
<line x1="145" y1="105" x2="145" y2="140" stroke="#334155" stroke-width="6"/>
<line x1="325" y1="105" x2="325" y2="140" stroke="#334155" stroke-width="6"/>
<text x="145" y="92" font-size="14" fill="#7a5c1e" text-anchor="middle" font-weight="700">더듬이</text>
<text x="325" y="92" font-size="14" fill="#334155" text-anchor="middle" font-weight="700">칼</text>
<text x="225" y="350" font-size="17" fill="#334155" text-anchor="middle" font-weight="700">더듬이가 본을 따라가면 칼이 같이 움직입니다</text>
<text x="225" y="376" font-size="15" fill="#4b5563" text-anchor="middle">같은 모양을 여러 개 만들기 좋습니다</text>
<rect x="520" y="70" width="320" height="130" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<text x="540" y="100" font-size="15" fill="#334155" font-weight="700">좌표 숫자 목록</text>
<text x="540" y="126" font-size="15" fill="#334155" font-family="monospace">X 10.0  Y 0.0</text>
<text x="540" y="148" font-size="15" fill="#334155" font-family="monospace">X 10.0  Y 25.0</text>
<text x="540" y="170" font-size="15" fill="#334155" font-family="monospace">X 40.0  Y 25.0</text>
<text x="540" y="192" font-size="15" fill="#334155" font-family="monospace">…</text>
<path d="M680 205 v42" stroke="#c2410c" stroke-width="4" marker-end="url(#c)"/>
<text x="700" y="232" font-size="14" fill="#c2410c" font-weight="700">읽어서 움직임</text>
<rect x="570" y="300" width="220" height="40" fill="#cfd8e6" stroke="#334155" stroke-width="2.5"/>
<polygon points="680,262 695,297 665,297" fill="#9fb0c8" stroke="#334155" stroke-width="2"/>
<text x="675" y="376" font-size="17" fill="#334155" text-anchor="middle" font-weight="700">본 대신 숫자가 칼을 움직입니다</text>
<text x="675" y="402" font-size="15" fill="#4b5563" text-anchor="middle">숫자만 바꾸면 다른 모양도 깎습니다</text>
</svg>
