 나사산이 남는다</text><text x="150" y="400" font-size="14" fill="#334155" font-weight="700" text-anchor="middle">자재</text><rect x="30" y="425" width="840" height="80" rx="10" fill="#f3f6fb" stroke="#c9d3e6"/><text x="450" y="455" font-size="16" fill="#334155" font-weight="700" text-anchor="middle">지금 기계에서는 ⑤ 터치스크린에 깊이를 넣으면, ① 모터 머리가 그 깊이에서 저절로 거꾸로 돕니다.</text><text x="450" y="483" font-size="16" fill="#334155" font-weight="700" text-anchor="middle">탭에 힘이 지나치게 걸리면 ② 탭 척의 클러치가 작동합니다.</text></svg>
