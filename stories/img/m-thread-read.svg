<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
<rect width="900" height="470" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker></defs>
<text x="450" y="36" font-size="23" fill="#1e3a8a" font-weight="900" text-anchor="middle">탭과 볼트에 적힌 「M10 × 1.5」 읽는 법</text><text x="300" y="108" font-size="64" fill="#c2410c" font-weight="900" text-anchor="middle">M</text><text x="400" y="108" font-size="64" fill="#1e3a8a" font-weight="900" text-anchor="middle">10</text><text x="505" y="108" font-size="52" fill="#334155" font-weight="700" text-anchor="middle">×</text><text x="600" y="108" font-size="64" fill="#15803d" font-weight="900" text-anchor="middle">1.5</text><text x="300" y="144" font-size="17" fill="#c2410c" font-weight="800" text-anchor="middle">미터 나사</text><text x="300" y="166" font-size="15" fill="#334155" font-weight="700" text-anchor="middle">나사산 각도 60°</text><text x="400" y="144" font-size="17" fill="#1e3a8a" font-weight="800" text-anchor="middle">외경</text><text x="400" y="166" font-size="15" fill="#334155" font-weight="700" text-anchor="middle">10mm</text><text x="600" y="144" font-size="17" fill="#15803d" font-weight="800" text-anchor="middle">피치</text><text x="600" y="166" font-size="15" fill="#334155" font-weight="700" text-anchor="middle">1.5mm</text><rect x="160" y="253.5884572681199" width="540" height="72.82308546376021" fill="#cbd5e1"/><polyline points="160.0,238 178.0,269.2 196.0,238 214.0,269.2 232.0,238 250.0,269.2 268.0,238 286.0,269.2 304.0,238 322.0,269.2 340.0,238 358.0,269.2 376.0,238 394.0,269.2 412.0,238 430.0,269.2 448.0,238 466.0,269.2 484.0,238 502.0,269.2 520.0,238 538.0,269.2 556.0,238 574.0,269.2 592.0,238 610.0,269.2 628.0,238 646.0,269.2 664.0,238 682.0,269.2 700.0,238 718.0,269.2" fill="none" stroke="#334155" stroke-width="2.4"/><polyline points="160.0,342 178.0,310.8 196.0,342 214.0,310.8 232.0,342 250.0,310.8 268.0,342 286.0,310.8 304.0,342 322.0,310.8 340.0,342 358.0,310.8 376.0,342 394.0,310.8 412.0,342 430.0,310.8 448.0,342 466.0,310.8 484.0,342 502.0,310.8 520.0,342 538.0,310.8 556.0,342 574.0,310.8 592.0,342 610.0,310.8 628.0,342 646.0,310.8 664.0,342 682.0,310.8 700.0,342 718.0,310.8" fill="none" stroke="#334155" stroke-width="2.4"/><path d="M730 238 V342" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#ar)" marker-start="url(#ar)"/><line x1="705" y1="238" x2="745" y2="238" stroke="#1e3a8a" stroke-width="1.5"/><line x1="705" y1="342" x2="745" y2="342" stroke="#1e3a8a" stroke-width="1.5"/><text x="752" y="296" font-size="16" fill="#1e3a8a" font-weight="800" text-anchor="start">외경 10mm</text><line x1="304" y1="234" x2="304" y2="204" stroke="#15803d" stroke-width="1.5"/><line x1="340" y1="234" x2="340" y2="204" stroke="#15803d" stroke-width="1.5"/><path d="M307 214 H337" stroke="#15803d" stroke-width="2.5"/><text x="322.0" y="196" font-size="15" fill="#15803d" font-weight="800" text-anchor="middle">피치 1.5mm</text><polyline points="502.0,310.8 520.0,342 538.0,310.8" fill="none" stroke="#c2410c" stroke-width="4.5"/><text x="520" y="374" font-size="15" fill="#c2410c" font-weight="800" text-anchor="middle">이 산의 양쪽 면이 이루는 각도 = 60°</text><rect x="40" y="395" width="820" height="60" rx="10" fill="#f3f6fb" stroke="#c9d3e6"/><text x="450" y="420" font-size="16" fill="#334155" font-weight="700" text-anchor="middle">보통 나사는 피치를 적지 않고 「M10」만 씁니다. M10 보통 나사의 피치가 1.5mm입니다.</text><text x="450" y="444" font-size="16" fill="#334155" font-weight="700" text-anchor="middle">서보 탭핑기 이름의 「M3-M16」은 M3부터 M16까지의 탭을 쓸 수 있다는 뜻입니다.</text></svg>
