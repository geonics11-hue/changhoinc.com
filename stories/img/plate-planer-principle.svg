<svg xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" viewBox="0 0 900 430" role="img" aria-label="평삭기 원리 그림 — 깎는 날은 기둥에 고정되어 있고, 공작물을 실은 작업대가 앞뒤로 움직입니다. 날이 공작물 윗면을 얇게 깎아 내 깎인 부스러기가 말려 떨어지고, 날이 지나간 쪽은 평평한 면이 됩니다">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e3a8a"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker></defs>
<rect width="900" height="430" fill="#fff"/>
<text x="450" y="36" font-size="23" font-weight="800" fill="#0f172a" text-anchor="middle">평삭기 — 날은 그대로, 작업대가 앞뒤로 움직입니다</text>
<!-- column -->
<rect x="470" y="60" width="70" height="120" fill="#cbd5e1" stroke="#334155" stroke-width="2.5"/>
<rect x="490" y="180" width="30" height="34" fill="#94a3b8" stroke="#334155" stroke-width="2.5"/>
<path d="M496 214 L514 214 L508 236 L498 236 Z" fill="#475569" stroke="#1e293b" stroke-width="2"/>
<!-- workpiece: cut part left (flat), uncut right (rough) -->
<path d="M200 300 L200 246 L503 246 L503 238 L507 236 L512 240 L530 236 L552 242 L575 235 L598 241 L622 234 L645 240 L668 236 L690 241 L700 238 L700 300 Z" fill="#a8b4c6" stroke="#334155" stroke-width="2.5"/>
<line x1="200" y1="246" x2="500" y2="246" stroke="#1e3a8a" stroke-width="4"/>
<!-- chips -->
<path d="M500 236 C 488 222, 470 222, 468 236 C 466 248, 480 250, 484 240" fill="none" stroke="#c2410c" stroke-width="3"/>
<path d="M440 244 c -8 -10, -20 -6, -16 2" fill="none" stroke="#c2410c" stroke-width="3"/>
<path d="M404 244 c -8 -10, -20 -6, -16 2" fill="none" stroke="#c2410c" stroke-width="3"/>
<!-- table -->
<rect x="150" y="300" width="600" height="30" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/>
<!-- bed -->
<rect x="90" y="330" width="720" height="26" fill="#cbd5e1" stroke="#334155" stroke-width="2.5"/>
<!-- motion arrow -->
<line x1="280" y1="380" x2="620" y2="380" stroke="#1e3a8a" stroke-width="4" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="450" y="420" font-size="19" font-weight="700" fill="#1e3a8a" text-anchor="middle">작업대가 공작물을 싣고 앞뒤로 움직입니다</text>
<!-- labels -->
<g font-size="18" fill="#0f172a">
<line x1="560" y1="120" x2="640" y2="98" stroke="#8b4513" stroke-width="1.5"/><text x="646" y="104">기둥</text>
<line x1="512" y1="228" x2="640" y2="150" stroke="#8b4513" stroke-width="1.5"/><text x="646" y="146" font-weight="700">깎는 날 — 제자리에 고정</text>
<line x1="470" y1="226" x2="330" y2="150" stroke="#8b4513" stroke-width="1.5"/><text x="150" y="146" font-weight="700" fill="#c2410c">깎인 부스러기(칩)</text>
<line x1="300" y1="246" x2="250" y2="200" stroke="#8b4513" stroke-width="1.5"/><text x="120" y="194" font-weight="700" fill="#1e3a8a">날이 지나간 면 — 평평</text>
<line x1="640" y1="238" x2="740" y2="200" stroke="#8b4513" stroke-width="1.5"/><text x="700" y="194">아직 안 깎은 면</text>
<text x="450" y="282" text-anchor="middle" fill="#1e293b">공작물(쇠 판)</text>
<text x="770" y="321">작업대</text>
<text x="820" y="349">바탕틀</text>
</g>
</svg>
