<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
<rect width="900" height="430" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker></defs>
<text x="450" y="38" font-size="24" font-weight="900" fill="#1e3a8a" text-anchor="middle">숫자 제어 — 본 대신 숫자가 칼을 움직인다</text>
<!-- tape -->
<rect x="40" y="90" width="210" height="250" fill="#fdf6e3" stroke="#334155" stroke-width="2.5"/>
<g fill="#334155">
<circle cx="70" cy="120" r="6"/><circle cx="100" cy="120" r="6"/><circle cx="190" cy="120" r="6"/>
<circle cx="70" cy="150" r="6"/><circle cx="130" cy="150" r="6"/><circle cx="160" cy="150" r="6"/><circle cx="220" cy="150" r="6"/>
<circle cx="100" cy="180" r="6"/><circle cx="190" cy="180" r="6"/>
<circle cx="70" cy="210" r="6"/><circle cx="130" cy="210" r="6"/><circle cx="220" cy="210" r="6"/>
<circle cx="100" cy="240" r="6"/><circle cx="160" cy="240" r="6"/><circle cx="190" cy="240" r="6"/>
<circle cx="70" cy="270" r="6"/><circle cx="220" cy="270" r="6"/>
<circle cx="130" cy="300" r="6"/><circle cx="160" cy="300" r="6"/>
</g>
<text x="145" y="368" font-size="16" fill="#334155" text-anchor="middle" font-weight="700">종이 테이프(1952년)</text>
<text x="145" y="392" font-size="14" fill="#4b5563" text-anchor="middle">구멍 자리가 곧 숫자</text>
<path d="M260 215 h60" stroke="#c2410c" stroke-width="4" marker-end="url(#ar)"/>
<!-- reader -->
<rect x="330" y="160" width="150" height="110" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/>
<text x="405" y="208" font-size="17" fill="#334155" text-anchor="middle" font-weight="700">읽는 장치</text>
<text x="405" y="234" font-size="14" fill="#4b5563" text-anchor="middle">X 40 · Y 25 · Z 5</text>
<path d="M490 215 h50" stroke="#c2410c" stroke-width="4" marker-end="url(#ar)"/>
<!-- machine -->
<rect x="660" y="80" width="40" height="80" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
<rect x="670" y="160" width="20" height="40" fill="#d8b36a" stroke="#334155" stroke-width="2"/>
<text x="712" y="108" font-size="14" fill="#334155" font-weight="700">Z 모터 — 깊이</text>
<rect x="580" y="220" width="250" height="40" fill="#cfd8e6" stroke="#334155" stroke-width="2.5"/>
<rect x="560" y="268" width="290" height="14" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
<rect x="550" y="300" width="40" height="34" fill="#64748b" stroke="#334155" stroke-width="2"/>
<line x1="590" y1="317" x2="850" y2="317" stroke="#334155" stroke-width="3" stroke-dasharray="4 4"/>
<text x="570" y="356" font-size="14" fill="#334155" font-weight="700">X 모터 — 좌우</text>
<rect x="800" y="140" width="40" height="34" fill="#64748b" stroke="#334155" stroke-width="2"/>
<text x="820" y="196" font-size="14" fill="#334155" text-anchor="middle" font-weight="700">Y 모터</text>
<text x="820" y="214" font-size="14" fill="#334155" text-anchor="middle" font-weight="700">— 앞뒤</text>
<text x="705" y="392" font-size="16" fill="#334155" text-anchor="middle" font-weight="700">세 모터가 숫자대로 칼과 테이블을 옮긴다</text>
<text x="450" y="420" font-size="15" fill="#4b5563" text-anchor="middle">지금의 CNC는 종이 테이프 대신 컴퓨터가 도면에서 숫자를 뽑아 모터를 움직입니다.</text>
</svg>
