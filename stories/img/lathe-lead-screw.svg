ext-anchor="start">축과 나사봉을 잇는다</text><rect x="40" y="395" width="820" height="56" rx="10" fill="#f3f6fb" stroke="#c9d3e6"/><text x="450" y="420" font-size="16" fill="#334155" font-weight="700" text-anchor="middle">축이 한 바퀴 돌 때 나사봉도 정해진 만큼 돌아, 날이 늘 같은 거리만큼 옆으로 갑니다.</text><text x="450" y="442" font-size="16" fill="#334155" font-weight="700" text-anchor="middle">톱니바퀴를 바꿔 끼우면 그 거리, 곧 나사산 간격(피치)이 바뀝니다.</text></svg>
