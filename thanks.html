<style>
:root{--blue:#0066cc;--blue-focus:#0071e3;--ink:#1d1d1f;--ink-muted:#6e6e73;--parchment:#f5f5f7;--hairline:#d2d2d7;--card-r:18px}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);
     font:400 16px/1.6 "Nanum Gothic","Noto Sans KR",system-ui,-apple-system,sans-serif}
a{color:var(--blue);text-decoration:none}
a:hover{color:var(--blue-focus)}
.util{border-bottom:1px solid var(--hairline);background:#000}
.util-in{max-width:1120px;margin:0 auto;padding:12px 20px}
.util-in img{height:30px;width:auto;display:block}
.wrap{max-width:720px;margin:0 auto;padding:72px 20px 96px;text-align:center}
.mark{width:64px;height:64px;border-radius:50%;background:var(--blue);color:#fff;
      display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 22px}
h1{font-size:32px;line-height:1.25;margin:0 0 14px;letter-spacing:-0.3px}
.lead{font-size:17px;color:var(--ink-muted);margin:0 0 6px}
.tel{margin:30px 0 40px;font-size:16px}
.tel a{font-weight:700;font-size:19px}
.next{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:left;margin-bottom:36px}
.next a{display:block;background:var(--parchment);border:1px solid var(--hairline);
        border-radius:var(--card-r);padding:18px 20px;color:var(--ink)}
.next a:hover{border-color:var(--blue)}
.next b{display:block;font-size:15px;margin-bottom:4px;color:var(--blue)}
.next span{font-size:13px;color:var(--ink-muted);line-height:1.5}
.home{font-size:15px}
.foot{border-top:1px solid var(--hairline);margin-top:8px;padding:26px 20px;text-align:center;
      font-size:13px;color:var(--ink-muted);line-height:1.8}
@media(max-width:700px){
  .wrap{padding:52px 18px 72px}
  h1{font-size:26px}
  .next{grid-template-columns:1fr}
}
</style>
</head>

</html>
