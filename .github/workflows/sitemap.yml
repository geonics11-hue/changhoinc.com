name: sitemap 자동 갱신

# html 파일이 main 에 올라올 때마다 sitemap.xml 을 다시 만들어 필요하면 자동 커밋합니다.
on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "generate_sitemap.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 파일별 마지막 수정일을 정확히 계산하려면 전체 이력이 필요합니다

      - name: sitemap.xml 생성
        run: python3 generate_sitemap.py

      - name: 바뀐 경우에만 커밋
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml 변경 없음"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "sitemap.xml 자동 갱신"
            git push
          fi
